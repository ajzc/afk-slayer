<!DOCTYPE html>
<!-- build iom7 -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0e1118" />
  <meta name="description" content="AFK Slayer — original AFK guild hunter idle game" />
  <title>AFK Slayer</title><!-- iom7-cache -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=iom7" />
</head>
<body>
  <div class="app">
    <header class="header hud" id="top-hud" aria-label="Status">
      <div class="hud-grid">
        <div class="hud-col hud-left">
          <div class="hud-pill hud-pill-sp" title="Slayer points">
            <span class="hud-ico" aria-hidden="true">⭐</span>
            <div class="hud-stack">
              <span class="hud-val" id="res-points">0</span>
              <span class="hud-rate" id="res-points-rate">(+0/m)</span>
            </div>
          </div>
          <div class="hud-pill hud-pill-sl" title="Slayer level — bar fills with current task kills">
            <div class="hud-sl-row">
              <span class="hud-sl-lab" id="slayer-level-chip">Slayer level 1</span>
            </div>
            <div class="hud-xp-bar" aria-hidden="true"><div class="hud-xp-fill" id="hud-sl-fill" style="width:0%"></div></div>
          </div>
        </div>
        <div class="hud-col hud-right">
          <div class="hud-pill hud-pill-gold res-gold-wrap" title="Gold">
            <img class="gold-icon gold-icon-hud" id="res-gold-ico" src="art/v3b/ui/gold/coins_1_32.png" width="20" height="20" alt="" data-gold-key="coins_1" aria-hidden="true">
            <div class="hud-stack">
              <span class="val gold-amount tier-raw" id="res-gold" style="color:#FFFF00">0</span>
              <span class="hud-rate" id="res-gold-rate">+0/m</span>
            </div>
          </div>
          <div class="hud-pill hud-pill-food" title="Food">
            <span class="hud-ico" aria-hidden="true">🍞</span>
            <div class="hud-stack">
              <span class="hud-val" id="res-food">0/0</span>
            </div>
            <span class="hud-chip hidden" id="res-prayer-wrap" title="Prayer points"><span class="hud-ico">🙏</span><span id="res-prayer">0</span></span>
            <span class="hud-chip hidden" id="res-scraps-wrap" title="Scraps"><span class="hud-ico">🔩</span><span id="res-scraps">0</span></span>
          </div>
        </div>
      </div>
    </header>

    <main class="main">
      <section id="screen-hunt" class="screen active">
        <div id="hunt-body"></div>
      </section>
      <section id="screen-board" class="screen">
        <div id="board-body"></div>
      </section>
      <section id="screen-upgrades" class="screen">
        <div id="upgrades-body"></div>
      </section>
      <section id="screen-maps" class="screen">
        <div id="maps-body"></div>
      </section>
      <section id="screen-guild" class="screen">
        <div id="guild-body"></div>
      </section>
      <section id="screen-codex" class="screen">
        <div id="codex-body"></div>
      </section>
      <section id="screen-settings" class="screen">
        <div id="settings-body"></div>
      </section>
    </main>

    <nav class="nav" aria-label="Primary">
      <div class="nav-inner" id="nav-inner">
        <button type="button" class="tab-btn active" data-tab="hunt" aria-label="Hunt"><span class="ico">🗡️</span><span class="tab-lab">Hunt</span></button>
        <button type="button" class="tab-btn" data-tab="board" aria-label="Slayer Master"><span class="ico">📋</span><span class="tab-lab">Master</span></button>
        <button type="button" class="tab-btn" data-tab="maps" aria-label="Progress"><span class="ico">🗺️</span><span class="tab-lab">Progress</span></button>
        <button type="button" class="tab-btn" data-tab="guild" aria-label="Guild"><span class="ico">🏛️</span><span class="tab-lab">Guild</span></button>
        <button type="button" class="tab-btn" data-tab="codex" aria-label="Codex"><span class="ico">📖</span><span class="tab-lab">Codex</span></button>
        <button type="button" class="tab-btn tab-settings" data-tab="settings" aria-label="Settings" title="Settings"><span class="ico">⚙️</span><span class="tab-lab">Settings</span></button>
      </div>
    </nav>
  </div>

  <div id="claim-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="claim-title">
    <div class="modal-sheet" id="claim-body">
      <h2 id="claim-title">While you were away…</h2>
    </div>
  </div>

  <script src="js/data.js?v=iom7"></script>
  <script src="js/format.js?v=iom7"></script>
  <script src="js/state.js?v=iom7"></script>
  <script src="js/audio.js?v=iom7"></script>
  <script src="js/sprites.js?v=iom7"></script>
  <script src="js/gearvis.js?v=iom7"></script>
  <script src="js/chests.js?v=iom7"></script>
  <script src="js/arena.js?v=iom7"></script>
  <script src="js/maps.js?v=iom7"></script>
  <script src="js/ui.js?v=iom7"></script>
  <script src="js/intro.js?v=iom7"></script>
  <script src="js/auth.js?v=iom7"></script>
  <script src="js/game.js?v=iom7"></script>
</body>
</html>
